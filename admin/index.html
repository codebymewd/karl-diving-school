<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Admin Management System | Karl Phelps Driving School</title><meta name="robots" content="noindex"><style>
:root{--red:#d9202a;--yel:#f7b500;--ink:#16181d;--mut:#5b6270;--bg:#f6f4f0;--card:#fff;--line:#e0dcd3}
@media(prefers-color-scheme:dark){:root{--ink:#f2f2f2;--mut:#aab0bb;--bg:#111317;--card:#1a1d24;--line:#2a2f38}}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.top{background:#fff;border-bottom:4px solid var(--yel);padding:8px 16px}.top img{height:48px;display:block}
.box{max-width:560px;margin:24px auto;padding:0 16px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
h1{margin:0 0 8px;font-size:1.5rem}h3{margin:16px 0 8px}.sub,.mu{color:var(--mut)}.sub{margin:0 0 16px}small{color:var(--mut)}
label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 6px}
input,select,textarea{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--bg);color:var(--ink)}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:520px){.r2{grid-template-columns:1fr}}
button{width:100%;min-height:48px;margin-top:16px;border:0;border-radius:10px;background:var(--red);color:#fff;font:700 1rem system-ui;cursor:pointer}button:disabled{opacity:.55}
.b3{background:transparent!important;color:var(--ink)!important;border:2px solid var(--ink)!important}
.sm{width:auto;min-height:36px;margin:0;padding:0 12px;font-size:.85rem}.lnk{background:none;color:var(--red);width:auto;margin:6px 0 0;text-decoration:underline}
.err{background:#fde8e9;color:#8a1017;border-radius:10px;padding:12px;margin:12px 0;display:none}.ok{background:#e6f5ea;color:#14602b;border-radius:10px;padding:12px;margin:12px 0;display:none}.warn{background:#fff4d6;color:#6b4e00;border-radius:10px;padding:12px;margin-bottom:12px;display:none}
.alt{text-align:center;margin-top:16px;color:var(--mut)}a{color:var(--red)}.lk{display:inline-block;background:var(--red);color:#fff;padding:12px 18px;border-radius:10px;text-decoration:none;font-weight:700;margin-top:8px}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:#16181d;padding:12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
aside img{background:#fff;border-radius:8px;padding:4px;height:46px;width:auto;margin-bottom:8px;align-self:flex-start}
aside button{background:none;color:#e5e7eb;text-align:left;margin:0;min-height:44px;padding:0 12px;border-radius:8px;font-size:.95rem;width:100%}aside button.on{background:var(--red);color:#fff}
main{padding:20px;min-width:0}
@media(max-width:820px){.shell{grid-template-columns:1fr}aside{flex-direction:row;height:auto;position:sticky;overflow-x:auto;z-index:5;padding-top:calc(8px + env(safe-area-inset-top,0px))}aside img{display:none}aside button{width:auto;white-space:nowrap}}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.cards .card{margin:0}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--red)}
.bd{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:700;background:#fff4d6;color:#6b4e00}.bd.g{background:#e6f5ea;color:#14602b}.bd.r{background:#fde8e9;color:#8a1017}
.sc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}.sc.un{border-left:5px solid var(--yel)}.sc .hd{display:flex;justify-content:space-between;gap:8px;align-items:center}
.ask{background:#fff4d6;color:#16181d;border-radius:10px;padding:12px;margin-top:10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.two button{margin-top:10px}
.tw{overflow-x:auto;margin-bottom:12px}table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:.9rem;vertical-align:top}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tabs button{margin-top:8px;background:transparent;color:var(--ink);border:2px solid var(--line)}.tabs button.on{border-color:var(--red);background:var(--red);color:#fff}
.opt{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:12px;margin:6px 0;font-weight:400;cursor:pointer}.opt input{width:auto;min-height:0}.opt.on{border-color:var(--red)}
.bank{background:var(--bg);border-left:5px solid var(--yel);padding:12px;border-radius:8px;margin:12px 0}.dot{background:var(--yel);color:#16181d;border-radius:99px;padding:0 7px;font-style:normal;font-size:.75rem}
</style></head><body><div id="lg" class="box" style="display:none"><div class="card"><h1>Staff sign in</h1><p class="sub">Admin and instructor access only.</p><div class="warn" id="warn"></div>
<form id="lf"><label>Email</label><input id="em" type="email" autocomplete="email" required><label>Password</label><input id="pw" type="password" autocomplete="current-password" required>
<button id="go">Sign in</button><button type="button" class="lnk" id="fp">Forgot password?</button><div class="err" id="err"></div><div class="ok" id="ok"></div></form></div></div>
<div id="cp" class="box" style="display:none"><div class="card"><h1>Set a new password</h1><p class="sub">You signed in with a temporary password. Choose your own to continue.</p>
<form id="cf"><label>New password (min 10 characters)</label><input id="np" type="password" autocomplete="new-password" minlength="10" required><label>Confirm</label><input id="np2" type="password" autocomplete="new-password" required><button>Save password</button><div class="err" id="cerr"></div></form></div></div>
<div class="shell" id="app" style="display:none"><aside id="nav"></aside><main id="main"></main></div>
<script type="module">

import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,updatePassword,sendPasswordResetEmail} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {FIREBASE_CONFIG,API_BASE} from "./config.js";
const configured=!!(FIREBASE_CONFIG.apiKey&&API_BASE);const $=s=>document.querySelector(s);
const auth=configured?getAuth(initializeApp(FIREBASE_CONFIG)):null;
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"₦"+Number(n||0).toLocaleString("en-NG");
const T=t=>new Date(t).toLocaleString("en-NG",{timeZone:"Africa/Lagos",weekday:"short",day:"numeric",month:"short",hour:"numeric",minute:"2-digit"});
const tm=t=>new Date(t).toLocaleTimeString("en-NG",{timeZone:"Africa/Lagos",hour:"numeric",minute:"2-digit"});
const day=t=>new Date(Date.parse(t)+36e5).toISOString().slice(0,10);
const tbl=(h,r)=>r.length?`<div class="tw"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${r.map(c=>`<tr>${c.map(x=>`<td>${x}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`:"<p class='mu'>Nothing to show.</p>";
const CODES={"auth/invalid-credential":"Incorrect email or password.","auth/wrong-password":"Incorrect email or password.","auth/user-not-found":"Incorrect email or password.","auth/weak-password":"Password is too weak.","auth/requires-recent-login":"Please sign in again, then retry.","auth/too-many-requests":"Too many attempts. Wait a few minutes.","auth/network-request-failed":"Network problem. Check your connection."};
const msg=e=>CODES[e.code]||e.message||"Something went wrong. Please try again.";
async function api(path,user,body){const r=await fetch(API_BASE+path,{method:body?"POST":"GET",headers:{Authorization:"Bearer "+await user.getIdToken(),"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Request failed ("+r.status+")");return j}

const NAV={admin:[["overview","Overview"],["payments","Payments"],["sessions","Sessions"],["students","Students"],["instructors","Instructors"],["notifications","Notifications"],["settings","Settings"]],instructor:[["overview","My Overview"],["sessions","My Sessions"],["notifications","Notifications"]]};
let user,me,tab="overview",flash="";
const show=id=>["lg","cp","app"].forEach(x=>$("#"+x).style.display=x===id?"":"none");
const say=(id,m,ok)=>{const e=$("#"+id);e.textContent=m;e.style.display="block"};
const badge=s=>`<span class="bd ${/Active|Confirmed|Completed|Ended|active/.test(s)?"g":/Rejected|Missed|suspended|Cancel/.test(s)?"r":"y"}">${esc(s)}</span>`;
if(!configured){show("lg");$("#warn").style.display="block";$("#warn").textContent="Setup needed: add your Firebase config and Worker URL in config.js.";$("#go").disabled=true}
else onAuthStateChanged(auth,async u=>{user=u;if(!u){show("lg");return}
 try{me=await api("/me",u);if(!["admin","instructor"].includes(me.role)){await signOut(auth);show("lg");return say("err","This portal is for school staff only.")}
  if(me.status!=="active"){await signOut(auth);show("lg");return say("err","This account is suspended or inactive.")}
  if(me.mustChangePassword)return show("cp");tab="overview";show("app");draw()}catch(e){await signOut(auth);show("lg");say("err",msg(e))}});
$("#lf").onsubmit=async e=>{e.preventDefault();$("#err").style.display="none";$("#go").disabled=true;try{await signInWithEmailAndPassword(auth,$("#em").value.trim(),$("#pw").value)}catch(x){say("err",msg(x))}$("#go").disabled=false};
$("#fp").onclick=async()=>{const m=$("#em").value.trim();if(!m)return say("err","Enter your email first.");try{await sendPasswordResetEmail(auth,m)}catch(_){}say("ok","If that account exists, a reset link has been sent.")};
$("#cf").onsubmit=async e=>{e.preventDefault();const p=$("#np").value;if(p.length<10||p!==$("#np2").value)return say("cerr","Passwords must match and be at least 10 characters.");
 try{await updatePassword(user,p);await api("/me/password-changed",user,{});await user.getIdToken(true);me.mustChangePassword=false;show("app");draw()}catch(x){say("cerr",msg(x))}};

async function go(){$("#main").innerHTML="<p>Loading...</p>";try{$("#main").innerHTML=(flash?`<div class="ok" style="display:block">${esc(flash)}</div>`:"")+await V[tab]();flash=""}catch(e){$("#main").innerHTML=`<div class="err" style="display:block">${esc(msg(e))}</div>`}}
const A=(p,b)=>api("/admin/"+p,user,b);
const cnt=(l,n)=>`<div class="card"><small>${l}</small><h2 style="margin:0">${n}</h2></div>`;
const V={
 async overview(){const o=await A("overview");
  if(me.role==="instructor")return `<h1>Overview</h1><h3>Today's sessions</h3>${sessTbl(o.today)}<h3>Upcoming</h3>${sessTbl(o.upcoming)}<h3>Missed-session reports</h3>${missTbl(o.missed)}`;
  const c=o.counts;return `<h1>Overview</h1><div class="cards">${cnt("Total students",c.students)}${cnt("Active enrollments",c.active)}${cnt("Pending payments",c.pendingPayments)}${cnt("Today's sessions",c.todaySessions)}${cnt("Upcoming sessions",c.upcomingSessions)}${cnt("Missed reports",c.missed)}${cnt("Active instructors",c.instructors)}</div>
  <h3>Recent missed sessions</h3>${missTbl(o.missed)}<h3>Recent notifications</h3>${o.notifications.map(n=>`<div class="sc"><b>${esc(n.title)}</b><div class="mu">${esc(n.body)}<br><small>${T(n.at)}</small></div></div>`).join("")||"<p class='mu'>None.</p>"}<h3>Recent activity</h3>${tbl(["When","Action","Record"],o.activity.map(a=>[T(a.at),esc(a.action),esc(a.ref||"")]))}`},
 async payments(){const [ps,pk]=await Promise.all([A("payments"),A("packages")]);
  return `<h1>Payments</h1>`+tbl(["Date","Student","Package","Method","Amount","Proof","Status",""],ps.map(p=>[T(p.createdAt),esc(p.studentName)+"<br><small>"+esc(p.studentId)+"</small>",esc(p.packageName),esc(p.method),money(p.amount),p.proofUrl?`<a target="_blank" rel="noopener" href="${esc(p.proofUrl)}">View</a>`:"-",badge(p.status)+(p.note?"<br><small>"+esc(p.note)+"</small>":""),p.status==="Verification Pending"?`<button class="sm" data-a="pay" data-id="${p.id}" data-v="1">Confirm</button> <button class="sm b3" data-a="pay" data-id="${p.id}" data-v="0">Reject</button>`:""]))+
  `<h3>Record an on-site payment</h3><form class="card" data-f="rec"><label>Student ID</label><input name="studentId" placeholder="KPDS-2026-00001" required><label>Package option</label><select name="po">${pk.flatMap(p=>p.options.map((o,i)=>`<option value="${esc(p.id)}|${i}">${esc(p.name)}: ${esc(o.label)} (${money(o.price)})</option>`)).join("")}</select><label>Amount paid (₦)</label><input name="amount" type="number" min="0" required><label>Date paid</label><input name="date" type="date" required><label>Notes</label><input name="note" maxlength="300"><button>Record and activate enrollment</button></form>`},
 async sessions(){const [ss,pk,ins]=await Promise.all([A("sessions"),fetch(API_BASE+"/packages").then(r=>r.json()),me.role==="admin"?A("instructors"):[]]);
  const types=["Online Theory","Simulation","Manual Driving","Automatic Driving","CBT Preparation","Other"];
  return `<h1>Sessions</h1><form class="card" data-f="sess"><h3>Create session</h3><label>Title</label><input name="title" required maxlength="100"><div class="r2"><div><label>Type</label><select name="type">${types.map(t=>`<option>${t}</option>`).join("")}</select></div><div><label>Package</label><select name="packageId">${pk.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("")}</select></div></div>
  <div class="r2"><div><label>Date</label><input name="date" type="date" required></div><div><label>Start (Lagos time)</label><input name="start" type="time" required></div></div><label>End (Lagos time)</label><input name="end" type="time" required>
  ${me.role==="admin"?`<label>Instructor</label><select name="instructorUid">${ins.filter(i=>i.status==="active").map(i=>`<option value="${esc(i.uid)}">${esc(i.fullName)}</option>`).join("")}</select>`:""}
  <label>Zoom / meeting link (optional)</label><input name="meetingLink" placeholder="https://..."><label>Physical location (optional)</label><input name="location" maxlength="200"><button>Create session</button></form><h3>All sessions</h3>`+sessTbl(ss,true)},
 async students(){const q=window.__q||"";const s=await A("students?q="+encodeURIComponent(q));
  return `<h1>Students</h1><form data-f="search" class="card"><label>Search by Student ID, name, email, phone or Enrollment ID</label><input name="q" value="${esc(q)}"><button>Search</button></form>`+tbl(["Student ID","Name","Email","Phone","Status","Enrollments"],s.map(x=>[esc(x.studentId),esc(x.fullName),esc(x.email),esc(x.phone),badge(x.enrollmentStatus||"Registered"),x.enrollments.map(e=>esc(e.package)+" "+badge(e.status)).join("<br>")||"-"]))},
 async instructors(){const l=await A("instructors");
  return `<h1>Instructors</h1>`+tbl(["ID","Name","Email","Phone","Type","Status",""],l.map(i=>[esc(i.instructorId),esc(i.fullName),esc(i.email),esc(i.phone),esc(i.type),badge(i.status),`<button class="sm ${i.status==="active"?"b3":""}" data-a="ins" data-id="${i.uid}" data-v="${i.status==="active"?"suspended":"active"}">${i.status==="active"?"Suspend":"Reactivate"}</button>`]))+
  `<h3>Create instructor</h3><form class="card" data-f="ins"><label>Full name</label><input name="fullName" required><label>Email</label><input name="email" type="email" required><label>Phone</label><input name="phone" type="tel" required><label>Instructor type</label><select name="type"><option>Online Instructor</option><option>Practical/Off-site Instructor</option><option>Hybrid Instructor</option></select><button>Create instructor</button></form>`},
 async notifications(){const n=await A("notifications");return `<h1>Notifications</h1><button class="sm b3" data-a="read">Mark all read</button>`+(n.map(x=>`<div class="sc${x.read?"":" un"}"><b>${esc(x.title)}</b><div class="mu">${esc(x.body)}<br><small>${T(x.at)}</small></div></div>`).join("")||"<p class='mu'>None.</p>")},
 async settings(){const [s,pk,lc]=await Promise.all([A("settings"),A("packages"),A("locations")]);const i=(k,l,t="text")=>`<label>${l}</label><input name="${k}" type="${t}" value="${esc(s[k]||"")}">`;
  return `<h1>School settings</h1><form class="card" data-f="set"><h3>Contact and bank details</h3>${i("phone","School phone")}${i("email","School email","email")}${i("whatsapp","WhatsApp number")}${i("bankName","Bank name")}${i("accountName","Account name")}${i("accountNumber","Account number")}<label>Required sessions per type (JSON)</label><textarea name="requirements" rows="4">${esc(s.requirements||"")}</textarea><button>Save settings</button></form>
  <form class="card" data-f="pk"><h3>Packages, prices and availability</h3><p class="mu">Edit the JSON. Set "active": false to hide a package.</p><textarea name="json" rows="14" style="font-family:monospace">${esc(JSON.stringify(pk.map(p=>({...p,active:true})),null,2))}</textarea><button>Save packages</button></form>
  <h3>Locations</h3>${tbl(["Name","Address","Hours","Phone",""],lc.map(l=>[esc(l.name),esc(l.address),esc(l.hours||""),esc(l.phone||""),`<button class="sm b3" data-a="loc" data-id="${l.id}">Remove</button>`]))}
  <form class="card" data-f="loc"><h3>Add location</h3><label>Name</label><input name="name" required><label>Full address</label><input name="address" required><label>Opening hours</label><input name="hours"><label>Phone</label><input name="phone"><label>Google Maps link</label><input name="mapUrl" placeholder="https://maps.google.com/..."><button>Add location</button></form>`}};
function sessTbl(l,admin){return tbl(["When","Title","Type","Instructor","Package","Status","Attended / Missed",""],l.map(s=>[T(s.startAt)+" – "+tm(s.endAt),esc(s.title)+(s.meetingLink?`<br><a target="_blank" rel="noopener" href="${esc(s.meetingLink)}">Meeting link</a>`:""),esc(s.type),esc(s.instructorName),esc(s.packageId),badge(s.status),(s.attended??"-")+" / "+(s.missed??"-"),s.status==="Started"?`<button class="sm" data-a="end" data-id="${s.id}">End session</button>`:""]))}
function missTbl(l){return tbl(["Student","Session","Instructor","Reason","Submitted"],l.map(m=>[esc(m.studentName)+"<br><small>"+esc(m.studentId)+"</small>",esc(m.sessionTitle),esc(m.instructorName),esc(m.reason)+(m.note?"<br><small>"+esc(m.note)+"</small>":""),T(m.at)]))}
document.addEventListener("click",async e=>{const t=e.target.closest("[data-t],[data-a]");if(!t)return;
 if(t.dataset.t){tab=t.dataset.t;return draw()}
 const a=t.dataset.a,id=t.dataset.id;
 try{if(a==="out"){await signOut(auth)}
  else if(a==="pay"){const ok=t.dataset.v==="1",note=prompt(ok?"Note (optional)":"Reason for rejection")||"";await A("payments/"+id+"/decision",{approve:ok,note});flash=ok?"Payment confirmed and enrollment activated.":"Payment rejected.";go()}
  else if(a==="end"){if(confirm("End this session now?")){await A("sessions/"+id+"/end",{});flash="Session ended.";go()}}
  else if(a==="ins"){await A("instructors/"+id+"/status",{status:t.dataset.v});flash="Instructor updated.";go()}
  else if(a==="read"){await api("/notifications/read",user,{});flash="Marked as read.";go()}
  else if(a==="loc"){if(confirm("Remove this location?")){await A("locations/"+id+"/delete",{});go()}}}
 catch(x){flash="";$("#main").insertAdjacentHTML("afterbegin",`<div class="err" style="display:block">${esc(msg(x))}</div>`)}});
document.addEventListener("submit",async e=>{const f=e.target.dataset.f;if(!f)return;e.preventDefault();const d=Object.fromEntries(new FormData(e.target));
 try{if(f==="search"){window.__q=d.q;return go()}
  if(f==="sess"){await A("sessions/create",d);flash="Session created. Enrolled students were notified."}
  if(f==="rec"){const[p,o]=d.po.split("|");await A("payments/record",{studentId:d.studentId,packageId:p,optionIndex:o,amount:d.amount,date:d.date,note:d.note});flash="On-site payment recorded and enrollment activated."}
  if(f==="ins"){const r=await A("instructors",d);alert(`Instructor created.\n\nInstructor ID: ${r.instructorId}\nEmail: ${r.email}\nTemporary password: ${r.tempPassword}\n\nShare this securely. It is shown only once, and they must change it at first login.`);flash="Instructor created."}
  if(f==="set"){await A("settings",d);flash="Settings saved."}
  if(f==="pk"){await A("packages",{packages:JSON.parse(d.json)});flash="Packages saved."}
  if(f==="loc"){await A("locations",d);flash="Location added."}
  go()}catch(x){$("#main").insertAdjacentHTML("afterbegin",`<div class="err" style="display:block">${esc(x instanceof SyntaxError?"Invalid JSON: "+x.message:msg(x))}</div>`)}});
</script>
