name = "kpds-api"
main = "index.js"
compatibility_date = "2026-10-01"

[triggers]
crons = ["* * * * *"]   # session status automation (Scheduled > Started > Ended) runs on the server every minute

[vars]
FIREBASE_PROJECT_ID = "YOUR_FIREBASE_PROJECT_ID"
ALLOWED_ORIGIN = "https://your-public-site.pages.dev,https://your-admin-site.pages.dev"
CLOUDINARY_CLOUD = "YOUR_CLOUD_NAME"
CLOUDINARY_API_KEY = "YOUR_CLOUDINARY_API_KEY"

# Secrets (never in this file):
#   npx wrangler secret put FB_CLIENT_EMAIL
#   npx wrangler secret put FB_PRIVATE_KEY
#   npx wrangler secret put CLOUDINARY_API_SECRET
#   npx wrangler secret put BOOTSTRAP_KEY      (temporary: used once to create the first admin, then delete it)
