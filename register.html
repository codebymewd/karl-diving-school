<style>
:root{--red:#d9202a;--yel:#f7b500;--ink:#16181d;--mut:#5b6270;--bg:#f6f4f0;--card:#fff;--line:#e0dcd3}
@media(prefers-color-scheme:dark){:root{--ink:#f2f2f2;--mut:#aab0bb;--bg:#111317;--card:#1a1d24;--line:#2a2f38}}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.top{background:#fff;border-bottom:4px solid var(--yel);padding:8px 16px}.top a{display:inline-block}.top img{height:48px;display:block}
.box{max-width:560px;margin:24px auto;padding:0 16px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
h1{margin:0 0 4px;font-size:1.6rem}.sub{color:var(--mut);margin:0 0 20px}
label{display:block;font-weight:600;font-size:.9rem;margin:14px 0 6px}
input,select,textarea{width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--bg);color:var(--ink)}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:520px){.r2{grid-template-columns:1fr}}
button{width:100%;min-height:50px;margin-top:20px;border:0;border-radius:10px;background:var(--red);color:#fff;font:700 1rem inherit;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}
.lnk{background:none;color:var(--red);width:auto;min-height:44px;margin:6px 0 0;padding:0;text-decoration:underline}
.err{background:#fde8e9;color:#8a1017;border-radius:10px;padding:12px;margin-top:14px;display:none}.ok{background:#e6f5ea;color:#14602b;border-radius:10px;padding:12px;margin-top:14px;display:none}
.warn{background:#fff4d6;color:#6b4e00;border-radius:10px;padding:12px;margin-bottom:14px;display:none}
.id{font-size:1.8rem;font-weight:800;letter-spacing:.04em;color:var(--red);text-align:center;margin:12px 0}
.alt{text-align:center;margin-top:16px;color:var(--mut)}.alt a{color:var(--red);font-weight:700}

<div class="box"><div class="card">
<h1>Create your student account</h1><p class="sub">Register first. You choose and pay for a package afterwards.</p>
<div class="warn" id="warn"></div>
<form id="f" novalidate>
<label for="fullName">Full name</label><input id="fullName" autocomplete="name" required maxlength="100">
<div class="r2"><div><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div>
<div><label for="phone">Phone number</label><input id="phone" type="tel" autocomplete="tel" placeholder="0803 000 0000" required></div></div>
<label for="address">Home address</label><input id="address" autocomplete="street-address" required maxlength="200">
<div class="r2"><div><label for="dob">Date of birth</label><input id="dob" type="date" required></div>
<div><label for="emName">Emergency contact name</label><input id="emName" required maxlength="100"></div></div>
<label for="emPhone">Emergency contact phone</label><input id="emPhone" type="tel" required>
<label for="photo">Passport photograph <small>(JPG or PNG, max 2 MB)</small></label><input id="photo" type="file" accept="image/jpeg,image/png">
<div class="r2"><div><label for="pw">Password</label><input id="pw" type="password" autocomplete="new-password" minlength="8" required></div>
<div><label for="pw2">Confirm password</label><input id="pw2" type="password" autocomplete="new-password" required></div></div>
<button id="go" type="submit">Create account</button>
<div class="err" id="err"></div><div class="ok" id="ok"></div>
</form>
<div id="done" style="display:none"><p>Your account is ready. Your Student ID is:</p><div class="id" id="sid"></div>
<p>Keep it safe. You will use it for payments, sessions and support. We sent a verification link to your email.</p>
<a href="login.html"><button type="button">Continue to login</button></a></div>
</div><p class="alt">Already registered? <a href="login.html">Log in</a></p></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,sendEmailVerification,sendPasswordResetEmail,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {FIREBASE_CONFIG,API_BASE} from "./config.js";
const configured=!!(FIREBASE_CONFIG.apiKey&&API_BASE);
const $=s=>document.querySelector(s);
const auth=configured?getAuth(initializeApp(FIREBASE_CONFIG)):null;
if(!configured){$("#warn").style.display="block";$("#warn").textContent="Setup needed: add your Firebase config and Worker URL in config.js.";$("#go").disabled=true}
const show=(id,t)=>{["err","ok"].forEach(x=>$("#"+x).style.display="none");const e=$("#"+id);e.textContent=t;e.style.display="block"};
const CODES={"auth/invalid-credential":"Incorrect email or password.","auth/wrong-password":"Incorrect email or password.","auth/user-not-found":"Incorrect email or password.","auth/weak-password":"Password must be at least 8 characters.","auth/invalid-email":"Enter a valid email address.","auth/too-many-requests":"Too many attempts. Please wait a few minutes and try again.","auth/network-request-failed":"Network problem. Check your connection and retry."};
const msg=e=>CODES[e.code]||e.message||"Something went wrong. Please try again.";
async function api(path,user,body){
 const r=await fetch(API_BASE+path,{method:body?"POST":"GET",headers:{Authorization:"Bearer "+await user.getIdToken(),"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
 const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Request failed ("+r.status+")");return j}

const PHONE=/^(\+234|0)[789][01]\d{8}$/;
$("#f").addEventListener("submit",async ev=>{
 ev.preventDefault();const v=id=>$("#"+id).value.trim();
 const p={fullName:v("fullName"),email:v("email").toLowerCase(),phone:v("phone").replace(/\s/g,""),address:v("address"),dob:v("dob"),emergencyName:v("emName"),emergencyPhone:v("emPhone").replace(/\s/g,"")};
 if(Object.values(p).some(x=>!x))return show("err","Please fill in all fields.");
 if(!PHONE.test(p.phone))return show("err","Enter a valid Nigerian phone number.");
 if($("#pw").value.length<8)return show("err","Password must be at least 8 characters.");
 if($("#pw").value!==$("#pw2").value)return show("err","Passwords do not match.");
 const file=$("#photo").files[0];
 if(file&&(!/^image\/(jpeg|png)$/.test(file.type)||file.size>2*1024*1024))return show("err","Photo must be a JPG or PNG under 2 MB.");
 $("#go").disabled=true;$("#go").textContent="Creating account...";
 try{
  let cred;
  try{cred=await createUserWithEmailAndPassword(auth,p.email,$("#pw").value)}
  catch(e){if(e.code==="auth/email-already-in-use")cred=await signInWithEmailAndPassword(auth,p.email,$("#pw").value);else throw e}
  const u=cred.user;
  if(file){
   const s=await api("/uploads/sign",u,{});
   const fd=new FormData();fd.append("file",file);["folder","timestamp","type","signature"].forEach(k=>fd.append(k,s[k]));fd.append("api_key",s.apiKey);
   const up=await fetch("https://api.cloudinary.com/v1_1/"+s.cloudName+"/image/upload",{method:"POST",body:fd});
   const uj=await up.json();if(!up.ok)throw new Error("Photo upload failed. Try a smaller image.");p.photoPublicId=uj.public_id}
  const res=await api("/students/register",u,p);
  await u.getIdToken(true);try{await sendEmailVerification(u)}catch(_){}
  await signOut(auth);
  $("#f").style.display="none";$("#sid").textContent=res.studentId;$("#done").style.display="block";
 }catch(e){show("err",msg(e));$("#go").disabled=false;$("#go").textContent="Create account"}
});
</script></body></html>
